apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: dailyfeed-search
  namespace: dailyfeed
spec:
  host: dailyfeed-search
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
      leastRequestLbConfig:
        choiceCount: 2

    connectionPool:
      tcp:
        maxConnections: 120           # 검색은 조금 더 많은 연결 필요
        connectTimeout: 3s
        tcpKeepalive:
          time: 7200s
          interval: 75s
          probes: 9
      http:
        http1MaxPendingRequests: 120
        http2MaxRequests: 550
        maxRequestsPerConnection: 10
        maxRetries: 3
        idleTimeout: 45s              # 검색 처리 시간 고려
        h2UpgradePolicy: UPGRADE

    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 3
      interval: 1m
      baseEjectionTime: 5m
      maxEjectionPercent: 50
      minHealthPercent: 30
      splitExternalLocalOriginErrors: true

  subsets:
  - name: v1
    labels:
      version: v1
