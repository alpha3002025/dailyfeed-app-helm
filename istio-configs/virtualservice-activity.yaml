apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dailyfeed-activity
  namespace: dailyfeed
spec:
  hosts:
  - dailyfeed-activity
  http:
  - route:
    - destination:
        host: dailyfeed-activity
        subset: v1
        port:
          number: 8080
      weight: 100

    # Timeout 설정
    timeout: 10s                      # 전체 요청 타임아웃

    # Retry 정책 (향상된 설정)
    retries:
      attempts: 5                     # 재시도 횟수
      perTryTimeout: 3s               # 시도당 타임아웃
      retryOn: gateway-error,connect-failure,refused-stream,5xx,retriable-4xx,reset
      retryRemoteLocalities: true     # 다른 로컬리티로도 재시도

    # Fault Injection (테스트용 - 프로덕션에서는 제거)
    # fault:
    #   delay:
    #     percentage:
    #       value: 0.1
    #     fixedDelay: 5s
    #   abort:
    #     percentage:
    #       value: 0.1
    #     httpStatus: 500
