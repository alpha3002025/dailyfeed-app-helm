{{- if .Values.cronJobs.listenerDeadletterRestore.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.appName }}-listener-dead-letter-restore
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
    job-type: listener-dead-letter-restore
spec:
  # Cron 스케줄 (기본: 1분마다 실행)
  schedule: {{ .Values.cronJobs.listenerDeadletterRestore.schedule | quote }}

  # 동시 실행 정책
  concurrencyPolicy: {{ .Values.cronJobs.listenerDeadletterRestore.concurrencyPolicy }}

  # Job History 관리
  successfulJobsHistoryLimit: {{ .Values.cronJobs.listenerDeadletterRestore.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronJobs.listenerDeadletterRestore.failedJobsHistoryLimit }}

  jobTemplate:
    spec:
      # Job 완료 후 Pod 유지 시간
      ttlSecondsAfterFinished: {{ .Values.cronJobs.listenerDeadletterRestore.ttlSecondsAfterFinished }}

      # 재시도 횟수
      backoffLimit: {{ .Values.cronJobs.listenerDeadletterRestore.backoffLimit }}

      template:
        metadata:
          labels:
            app: {{ .Values.appName }}
            job-type: listener-dead-letter-restore
        spec:
          restartPolicy: {{ .Values.cronJobs.listenerDeadletterRestore.restartPolicy }}

          containers:
          - name: {{ .Values.appName }}-listener-dead-letter-restore
            image: ghcr.io/alpha3002025/{{ .Values.appName }}-svc:{{ .Values.imageTag }}
            imagePullPolicy: {{ .Values.imagePullPolicy }}

            # 배치 Job 실행 명령
            args:
            - "--spring.profiles.active={{ .Values.profile }}"
            - "--spring.batch.job.name=listenerDeadletterRestoreJob"
            - "--spring.task.scheduling.enabled=false"
            - "--spring.main.web-application-type=none"
            - "requestedAt=$(date +%Y-%m-%dT%H:%M:%S.%N)"

            env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.profile }}
            - name: MYSQL_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_JDBC_URL
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_SCHEMA
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_PORT
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_URI
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: KAFKA_BOOTSTRAP_SERVERS
            {{- with .Values.cronJobs.listenerDeadletterRestore.envValues }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

            resources:
              requests:
                memory: {{ .Values.cronJobs.listenerDeadletterRestore.resources.memory.requests }}
                cpu: {{ .Values.cronJobs.listenerDeadletterRestore.resources.cpu.requests }}
              limits:
                memory: {{ .Values.cronJobs.listenerDeadletterRestore.resources.memory.limits }}
                cpu: {{ .Values.cronJobs.listenerDeadletterRestore.resources.cpu.limits }}
{{- end }}
