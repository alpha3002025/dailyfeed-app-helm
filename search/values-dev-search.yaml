imageTag: cbt-20251103-1
appName: dailyfeed-search
replicas: 1
profile: dev
portNumber: 8080
envValues:
- name: SERVER_PORT
  value: "8080"
- name: MEMBER_SERVICE_URL
  value: http://dailyfeed-member-svc.dailyfeed.svc.cluster.local:8080
- name: SEARCH_SERVICE_URL
  value: http://dailyfeed-search-svc.dailyfeed.svc.cluster.local:8080
- name: CONTENT_SERVICE_URL
  value: http://dailyfeed-content-svc.dailyfeed.svc.cluster.local:8080
- name: ACTIVITY_SERVICE_URL
  value: http://dailyfeed-activity-svc.dailyfeed.svc.cluster.local:8080
- name: IMAGE_SERVICE_URL
  value: http://dailyfeed-image-svc.dailyfeed.svc.cluster.local:8080
- name: TIMELINE_SERVICE_URL
  value: http://dailyfeed-timeline-svc.dailyfeed.svc.cluster.local:8080
configSecretItems:
- kafka
- redis
- mysql
- mongodb
resources:
  memory:
    requests: "480Mi"
    limits: "800Mi"
  cpu:
    requests: "300m"
    limits: "2000m"
probeValues:
  readiness:
    httpGetPath: /healthcheck/ready
    httpGetPort: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  liveness:
    httpGetPath: /healthcheck/live
    httpGetPort: 8080
    initialDelaySeconds: 5
    periodSeconds: 15
    successThreshold: 1
    failureThreshold: 3
  startup:
    httpGetPath: /healthcheck/startup
    httpGetPort: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 80
#debugValues:
#- name: JAVA_TOOL_OPTIONS
#  value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
persistence:
  enabled: false
  storageClass: local-path
  storageRequest: "1Gi"
  accessModes:
  - ReadWriteOnce
  mountPath: /data
