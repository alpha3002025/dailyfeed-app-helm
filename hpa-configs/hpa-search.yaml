apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dailyfeed-search-hpa
  namespace: dailyfeed
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dailyfeed-search
  minReplicas: 2
  maxReplicas: 12                       # 검색 부하 대비
  metrics:
  # 검색은 CPU와 메모리 모두 중요
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80          # 검색은 더 빠르게 반응
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80          # 검색 인덱스 메모리 고려
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
