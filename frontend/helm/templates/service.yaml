apiVersion: v1
kind: Service
metadata:
  name: {{ include "dailyfeed-frontend.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dailyfeed-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: {{ .Values.service.protocol }}
    name: {{ .Values.service.name }}
  selector:
    {{- include "dailyfeed-frontend.selectorLabels" . | nindent 4 }}
