# Default values for dailyfeed-frontend
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: ghcr.io/alpha3002025/dailyfeed-frontend-svc
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "cbt-20251103-1"

nameOverride: ""
fullnameOverride: "dailyfeed-frontend"

namespace: dailyfeed

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  protocol: TCP
  name: http

# Environment configuration
environment: local-k8s

# Backend service URLs
backendServices:
  memberService:
    url: "http://dailyfeed-member-svc:8080"
  contentService:
    url: "http://dailyfeed-content-svc:8080"
  timelineService:
    url: "http://dailyfeed-timeline-svc:8080"
  activityService:
    url: "http://dailyfeed-activity-svc:8080"
  imageService:
    url: "http://dailyfeed-image-svc:8080"
  searchService:
    url: "http://dailyfeed-search-svc:8080"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: dailyfeed.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: dailyfeed-frontend-tls
  #    hosts:
  #      - dailyfeed.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
